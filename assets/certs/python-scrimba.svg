<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="pythonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3776ab"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#certBg)"/>
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="url(#pythonGrad)" stroke-width="4"/>

  <circle cx="400" cy="110" r="35" fill="rgba(55,118,171,0.2)" stroke="#3776ab" stroke-width="2"/>
  <text x="400" y="118" fill="#ffd43b" font-family="sans-serif" font-size="28" text-anchor="middle">🐍</text>

  <text x="400" y="180" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="800" font-size="30" letter-spacing="4" text-anchor="middle">SCRIMBA COURSE CERTIFICATE</text>
  <text x="400" y="210" fill="#8b949e" font-family="sans-serif" font-size="15" text-anchor="middle">THIS CERTIFIES THAT</text>

  <text x="400" y="265" fill="#58a6ff" font-family="'Poppins', sans-serif" font-weight="700" font-size="34" text-anchor="middle">Yoganantham Sangothayan</text>
  <line x1="200" y1="280" x2="600" y2="280" stroke="url(#pythonGrad)" stroke-width="2"/>

  <text x="400" y="325" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="bold" font-size="22" text-anchor="middle">PYTHON PROGRAMMING COURSE</text>
  <text x="400" y="360" fill="#8b949e" font-family="sans-serif" font-size="14" text-anchor="middle">Has successfully completed the interactive Python Developer course on Scrimba,</text>
  <text x="400" y="382" fill="#8b949e" font-family="sans-serif" font-size="14" text-anchor="middle">mastering data structures, object-oriented concepts, and GUI app development.</text>

  <g transform="translate(150, 480)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="#30363d" stroke-width="1.5"/>
    <text x="90" y="20" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Scrimba Instructor</text>
  </g>

  <g transform="translate(470, 480)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="#30363d" stroke-width="1.5"/>
    <text x="90" y="20" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Scrimba Learning Platform</text>
  </g>
</svg>
