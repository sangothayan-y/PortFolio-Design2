<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ieeeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#certBg)"/>
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="url(#ieeeGrad)" stroke-width="4"/>

  <circle cx="400" cy="110" r="35" fill="rgba(129,140,248,0.2)" stroke="#818cf8" stroke-width="2"/>
  <text x="400" y="118" fill="#818cf8" font-family="sans-serif" font-size="28" text-anchor="middle">⚡</text>

  <text x="400" y="180" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="800" font-size="30" letter-spacing="4" text-anchor="middle">IEEE PARTICIPATION CERTIFICATE</text>
  <text x="400" y="210" fill="#a5b4fc" font-family="sans-serif" font-size="15" text-anchor="middle">PROUDLY AWARDED TO</text>

  <text x="400" y="265" fill="#c084fc" font-family="'Poppins', sans-serif" font-weight="700" font-size="34" text-anchor="middle">Yoganantham Sangothayan</text>
  <line x1="200" y1="280" x2="600" y2="280" stroke="url(#ieeeGrad)" stroke-width="2"/>

  <text x="400" y="325" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="bold" font-size="22" text-anchor="middle">VANNI XTREME IEEE 2.0</text>
  <text x="400" y="360" fill="#cbd5e1" font-family="sans-serif" font-size="14" text-anchor="middle">For successful participation in Vanni Xtreme IEEE 2.0 technical hackathon,</text>
  <text x="400" y="382" fill="#cbd5e1" font-family="sans-serif" font-size="14" text-anchor="middle">innovative project design, and student engagement in the Vanni Region.</text>

  <g transform="translate(150, 480)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="#64748b" stroke-width="1.5"/>
    <text x="90" y="20" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">IEEE Student Branch</text>
  </g>

  <g transform="translate(470, 480)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="#64748b" stroke-width="1.5"/>
    <text x="90" y="20" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">University of Vavuniya</text>
  </g>
</svg>
