<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f4efe6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#certBg)"/>
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <rect x="40" y="40" width="720" height="520" fill="none" stroke="#1f2937" stroke-width="2"/>

  <circle cx="400" cy="110" r="35" fill="url(#gold)"/>
  <text x="400" y="118" fill="#111827" font-family="sans-serif" font-size="28" text-anchor="middle">📷</text>

  <text x="400" y="180" fill="#111827" font-family="'Georgia', serif" font-weight="700" font-size="30" letter-spacing="3" text-anchor="middle">ANNUAL PHOTOGRAPHY AWARD</text>
  <text x="400" y="210" fill="#6b7280" font-family="'Georgia', serif" font-style="italic" font-size="16" text-anchor="middle">HONORING EXCEPTIONAL MEDIA COVERAGE</text>

  <text x="400" y="265" fill="#1e3a8a" font-family="'Georgia', serif" font-weight="700" font-size="36" text-anchor="middle">Yoganantham Sangothayan</text>
  <line x1="200" y1="280" x2="600" y2="280" stroke="url(#gold)" stroke-width="3"/>

  <text x="400" y="320" fill="#111827" font-family="sans-serif" font-weight="bold" font-size="22" text-anchor="middle">BEST VOLUNTEER PHOTOGRAPHER OF THE YEAR 2025</text>
  <text x="400" y="355" fill="#374151" font-family="sans-serif" font-size="15" text-anchor="middle">Awarded by Zero Plastic Vavuniya Community for outstanding event storytelling,</text>
  <text x="400" y="380" fill="#374151" font-family="sans-serif" font-size="15" text-anchor="middle">media production, and visual documentation excellence.</text>

  <g transform="translate(150, 480)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="#6b7280" stroke-width="1.5"/>
    <text x="90" y="20" fill="#111827" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Head of Media</text>
  </g>

  <g transform="translate(470, 480)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="#6b7280" stroke-width="1.5"/>
    <text x="90" y="20" fill="#111827" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Zero Plastic Vavuniya</text>
  </g>
</svg>
