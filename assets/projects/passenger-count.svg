<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad)"/>

  <!-- Phone Mockup Container in Center -->
  <rect x="250" y="20" width="300" height="410" rx="28" fill="#020617" stroke="#334155" stroke-width="4"/>
  <rect x="340" y="28" width="120" height="18" rx="9" fill="#0f172a"/>

  <!-- Phone Screen Content -->
  <rect x="260" y="55" width="280" height="360" rx="16" fill="#f8fafc"/>

  <!-- App Header -->
  <rect x="260" y="55" width="280" height="50" fill="#1e293b"/>
  <text x="400" y="85" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="700" font-size="16" text-anchor="middle">🚌 PaxCounter Web App</text>

  <!-- Big Counter Display -->
  <rect x="280" y="125" width="240" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="150" fill="#64748b" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">CURRENT PASSENGER COUNT</text>
  <text x="400" y="210" fill="#1e293b" font-family="'Poppins', sans-serif" font-weight="900" font-size="48" text-anchor="middle">14</text>

  <!-- Action Buttons -->
  <rect x="280" y="250" width="112" height="48" rx="10" fill="#2563eb"/>
  <text x="336" y="280" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">+ Increment</text>

  <rect x="408" y="250" width="112" height="48" rx="10" fill="#ef4444"/>
  <text x="464" y="280" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">- Save/Reset</text>

  <!-- Log Entry Rows -->
  <rect x="280" y="315" width="240" height="85" rx="10" fill="#f1f5f9"/>
  <text x="295" y="335" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold">PREVIOUS ENTRIES:</text>
  <text x="295" y="358" fill="#1e293b" font-family="sans-serif" font-size="12">Stop 1 (City Center): <tspan font-weight="bold" fill="#2563eb">+8 pax</tspan></text>
  <text x="295" y="380" fill="#1e293b" font-family="sans-serif" font-size="12">Stop 2 (University): <tspan font-weight="bold" fill="#2563eb">+6 pax</tspan></text>

  <!-- Side info graphics -->
  <text x="60" y="200" fill="#94a3b8" font-family="'Poppins', sans-serif" font-weight="700" font-size="20">Interactive</text>
  <text x="60" y="230" fill="#3b82f6" font-family="'Poppins', sans-serif" font-weight="900" font-size="28">Passenger Tally</text>
  <text x="60" y="260" fill="#64748b" font-family="sans-serif" font-size="13">Built with HTML5, CSS3 &amp; JS DOM</text>

  <text x="590" y="200" fill="#94a3b8" font-family="'Poppins', sans-serif" font-weight="700" font-size="20">Real-time</text>
  <text x="590" y="230" fill="#10b981" font-family="'Poppins', sans-serif" font-weight="900" font-size="28">Log Retention</text>
  <text x="590" y="260" fill="#64748b" font-family="sans-serif" font-size="13">Instant state updates &amp; reset</text>
</svg>
