<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Grid overlay -->
  <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Header Bar -->
  <rect x="20" y="20" width="760" height="50" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="50" cy="45" r="14" fill="#06b6d4"/>
  <path d="M44 45 H56 M50 39 V51" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="75" y="51" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="700" font-size="16">PharmAssist Pro — Pharmacy Management System</text>
  <rect x="660" y="33" width="100" height="24" rx="12" fill="url(#accentGrad)"/>
  <text x="710" y="49" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">v2.4 Active</text>

  <!-- Metric Cards -->
  <rect x="20" y="85" width="175" height="75" rx="10" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1"/>
  <text x="35" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12">Total Stock Items</text>
  <text x="35" y="140" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="800" font-size="22">14,231</text>
  <circle cx="165" cy="122" r="16" fill="rgba(6,182,212,0.15)"/>
  <path d="M158 122 L163 127 L173 117" stroke="#06b6d4" stroke-width="2.5" fill="none"/>

  <rect x="215" y="85" width="175" height="75" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="230" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12">Prescriptions Today</text>
  <text x="230" y="140" fill="#3b82f6" font-family="'Poppins', sans-serif" font-weight="800" font-size="22">312</text>

  <rect x="410" y="85" width="175" height="75" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="425" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12">Low Stock Alerts</text>
  <text x="425" y="140" fill="#f59e0b" font-family="'Poppins', sans-serif" font-weight="800" font-size="22">18 Items</text>

  <rect x="605" y="85" width="175" height="75" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="620" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12">Revenue (Bulk Billing)</text>
  <text x="620" y="140" fill="#10b981" font-family="'Poppins', sans-serif" font-weight="800" font-size="22">$148,520</text>

  <!-- Table View -->
  <rect x="20" y="175" width="465" height="255" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
  <text x="40" y="205" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="600" font-size="14">Drug Inventory Overview</text>
  
  <rect x="35" y="220" width="435" height="30" rx="6" fill="#0f172a"/>
  <text x="50" y="240" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">DRUG NAME</text>
  <text x="210" y="240" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">SKU</text>
  <text x="310" y="240" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">QUANTITY</text>
  <text x="400" y="240" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">STATUS</text>

  <!-- Table Rows -->
  <g font-family="sans-serif" font-size="12" fill="#e2e8f0">
    <text x="50" y="280">Amoxicillin 500mg</text>
    <text x="210" y="280" fill="#94a3b8">SKU-16501</text>
    <text x="310" y="280">1,250 Tabs</text>
    <rect x="400" y="267" width="55" height="18" rx="9" fill="rgba(16,185,129,0.2)"/>
    <text x="427" y="280" fill="#10b981" font-size="10" text-anchor="middle">In Stock</text>

    <text x="50" y="320">Metformin 850mg</text>
    <text x="210" y="320" fill="#94a3b8">SKU-16502</text>
    <text x="310" y="320">2,890 Tabs</text>
    <rect x="400" y="307" width="55" height="18" rx="9" fill="rgba(16,185,129,0.2)"/>
    <text x="427" y="320" fill="#10b981" font-size="10" text-anchor="middle">In Stock</text>

    <text x="50" y="360">Ibuprofen 400mg</text>
    <text x="210" y="360" fill="#94a3b8">SKU-16903</text>
    <text x="310" y="360">980 Tabs</text>
    <rect x="400" y="347" width="55" height="18" rx="9" fill="rgba(245,158,11,0.2)"/>
    <text x="427" y="360" fill="#f59e0b" font-size="10" text-anchor="middle">Low</text>

    <text x="50" y="400">Atorvastatin 20mg</text>
    <text x="210" y="400" fill="#94a3b8">SKU-16904</text>
    <text x="310" y="400">510 Tabs</text>
    <rect x="400" y="387" width="55" height="18" rx="9" fill="rgba(239,68,68,0.2)"/>
    <text x="427" y="400" fill="#ef4444" font-size="10" text-anchor="middle">Critical</text>
  </g>

  <!-- Right Panel Chart -->
  <rect x="500" y="175" width="280" height="255" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
  <text x="520" y="205" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="600" font-size="14">Sales &amp; Discount Trends</text>
  
  <path d="M520 390 Q570 330 620 350 T720 250 T760 270" stroke="url(#accentGrad)" stroke-width="3.5" fill="none" filter="url(#glow)"/>
  <path d="M520 390 Q570 330 620 350 T720 250 T760 270 L760 410 L520 410 Z" fill="rgba(6,182,212,0.1)"/>

  <circle cx="720" cy="250" r="5" fill="#06b6d4"/>
  <rect x="680" y="215" width="80" height="24" rx="4" fill="#0f172a" stroke="#06b6d4"/>
  <text x="720" y="231" fill="#06b6d4" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Peak +34%</text>
</svg>
