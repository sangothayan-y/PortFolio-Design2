<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad)"/>

  <!-- Nav Header -->
  <rect x="0" y="0" width="800" height="60" fill="#ffffff" stroke="#e7e5e4"/>
  <circle cx="45" cy="30" r="14" fill="#047857"/>
  <path d="M45 20 Q52 27 45 38 Q38 27 45 20 Z" fill="#ecfdf5"/>
  <text x="70" y="36" fill="#064e3b" font-family="'Poppins', serif" font-weight="700" font-size="18">Secret Garden</text>

  <g font-family="sans-serif" font-size="12" fill="#44403c" font-weight="600">
    <text x="450" y="35">Shop All</text>
    <text x="520" y="35">Bouquets</text>
    <text x="600" y="35">Occasions</text>
    <text x="680" y="35">Reviews</text>
  </g>
  <circle cx="750" cy="30" r="14" fill="#ecfdf5"/>
  <text x="750" y="34" fill="#047857" font-family="sans-serif" font-size="12" text-anchor="middle">🛒 2</text>

  <!-- Hero Section -->
  <rect x="30" y="80" width="740" height="150" rx="16" fill="url(#heroGrad)"/>
  <text x="60" y="130" fill="#ecfdf5" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="2">BOUTIQUE FLORAL STUDIO</text>
  <text x="60" y="165" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="800" font-size="26">Bring Nature Home — Fresh Blooms</text>
  <text x="60" y="190" fill="#a7f3d0" font-family="sans-serif" font-size="13">Handcrafted bouquets and floral arrangements delivered daily.</text>
  
  <rect x="580" y="170" width="160" height="40" rx="20" fill="#fde68a"/>
  <text x="660" y="195" fill="#78350f" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Explore Collection →</text>

  <!-- Product Showcase Grid -->
  <g transform="translate(30, 250)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="170" height="170" rx="12" fill="#ffffff" stroke="#e7e5e4"/>
    <rect x="10" y="10" width="150" height="95" rx="8" fill="#fbcfe8"/>
    <text x="85" y="65" font-size="40" text-anchor="middle">🌸</text>
    <text x="15" y="125" fill="#1c1917" font-family="sans-serif" font-weight="bold" font-size="13">Blush Hydrangea</text>
    <text x="15" y="145" fill="#047857" font-family="sans-serif" font-weight="bold" font-size="14">$45.00</text>
    <rect x="125" y="130" width="30" height="26" rx="6" fill="#047857"/>
    <text x="140" y="147" fill="#ffffff" font-size="14" text-anchor="middle">+</text>

    <!-- Item 2 -->
    <rect x="190" y="0" width="170" height="170" rx="12" fill="#ffffff" stroke="#e7e5e4"/>
    <rect x="200" y="10" width="150" height="95" rx="8" fill="#fef08a"/>
    <text x="275" y="65" font-size="40" text-anchor="middle">🌻</text>
    <text x="205" y="125" fill="#1c1917" font-family="sans-serif" font-weight="bold" font-size="13">Sunburst Bouquet</text>
    <text x="205" y="145" fill="#047857" font-family="sans-serif" font-weight="bold" font-size="14">$38.00</text>
    <rect x="315" y="130" width="30" height="26" rx="6" fill="#047857"/>
    <text x="330" y="147" fill="#ffffff" font-size="14" text-anchor="middle">+</text>

    <!-- Item 3 -->
    <rect x="380" y="0" width="170" height="170" rx="12" fill="#ffffff" stroke="#e7e5e4"/>
    <rect x="390" y="10" width="150" height="95" rx="8" fill="#ddd6fe"/>
    <text x="465" y="65" font-size="40" text-anchor="middle">🪻</text>
    <text x="395" y="125" fill="#1c1917" font-family="sans-serif" font-weight="bold" font-size="13">Lavender Dreams</text>
    <text x="395" y="145" fill="#047857" font-family="sans-serif" font-weight="bold" font-size="14">$42.00</text>
    <rect x="505" y="130" width="30" height="26" rx="6" fill="#047857"/>
    <text x="520" y="147" fill="#ffffff" font-size="14" text-anchor="middle">+</text>

    <!-- Item 4 -->
    <rect x="570" y="0" width="170" height="170" rx="12" fill="#ffffff" stroke="#e7e5e4"/>
    <rect x="580" y="10" width="150" height="95" rx="8" fill="#fecaca"/>
    <text x="655" y="65" font-size="40" text-anchor="middle">🌹</text>
    <text x="585" y="125" fill="#1c1917" font-family="sans-serif" font-weight="bold" font-size="13">Classic Red Roses</text>
    <text x="585" y="145" fill="#047857" font-family="sans-serif" font-weight="bold" font-size="14">$55.00</text>
    <rect x="695" y="130" width="30" height="26" rx="6" fill="#047857"/>
    <text x="710" y="147" fill="#ffffff" font-size="14" text-anchor="middle">+</text>
  </g>
</svg>
