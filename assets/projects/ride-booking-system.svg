<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a86ff"/>
      <stop offset="50%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#7209b7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Map Grid styling -->
  <path d="M150 0 V450 M300 0 V450 M450 0 V450 M600 0 V450" stroke="rgba(255,255,255,0.05)" stroke-width="14"/>
  <path d="M0 100 H800 M0 220 H800 M0 340 H800" stroke="rgba(255,255,255,0.05)" stroke-width="14"/>

  <!-- Route Line -->
  <path d="M 120 340 Q 250 340 300 220 T 450 100 T 680 180" fill="none" stroke="url(#routeGrad)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Waypoints -->
  <circle cx="120" cy="340" r="12" fill="#3a86ff" stroke="#ffffff" stroke-width="3"/>
  <circle cx="680" cy="180" r="12" fill="#f72585" stroke="#ffffff" stroke-width="3"/>

  <rect x="75" y="280" width="90" height="32" rx="6" fill="#1c2541" stroke="#3a86ff"/>
  <text x="120" y="301" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Pickup Point</text>

  <rect x="635" y="120" width="90" height="32" rx="6" fill="#1c2541" stroke="#f72585"/>
  <text x="680" y="141" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Destination</text>

  <!-- App Overlay Dashboard Card -->
  <rect x="30" y="30" width="340" height="390" rx="16" fill="rgba(11, 19, 43, 0.92)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>

  <text x="55" y="65" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="800" font-size="18">RideFlow — Booking Engine</text>
  <text x="55" y="85" fill="#4cc9f0" font-family="sans-serif" font-size="12">OOP Distance Fare Simulator</text>

  <!-- Vehicle Category Selectors -->
  <g transform="translate(55, 110)">
    <!-- Car -->
    <rect x="0" y="0" width="85" height="70" rx="10" fill="rgba(58, 134, 255, 0.2)" stroke="#3a86ff" stroke-width="2"/>
    <text x="42" y="30" fill="#ffffff" font-family="sans-serif" font-size="20" text-anchor="middle">🚗</text>
    <text x="42" y="48" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Car</text>
    <text x="42" y="62" fill="#4cc9f0" font-family="sans-serif" font-size="10" text-anchor="middle">$12.50</text>

    <!-- Bike -->
    <rect x="98" y="0" width="85" height="70" rx="10" fill="#1c2541" stroke="rgba(255,255,255,0.1)"/>
    <text x="140" y="30" fill="#ffffff" font-family="sans-serif" font-size="20" text-anchor="middle">🏍️</text>
    <text x="140" y="48" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Bike</text>
    <text x="140" y="62" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">$6.80</text>

    <!-- Auto -->
    <rect x="195" y="0" width="85" height="70" rx="10" fill="#1c2541" stroke="rgba(255,255,255,0.1)"/>
    <text x="237" y="30" fill="#ffffff" font-family="sans-serif" font-size="20" text-anchor="middle">🛺</text>
    <text x="237" y="48" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Auto</text>
    <text x="237" y="62" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">$9.20</text>
  </g>

  <!-- Fare Details -->
  <rect x="55" y="200" width="290" height="130" rx="10" fill="#1c2541"/>
  <text x="75" y="228" fill="#94a3b8" font-family="sans-serif" font-size="12">Distance Traveled:</text>
  <text x="325" y="228" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="end">6.8 km</text>

  <text x="75" y="258" fill="#94a3b8" font-family="sans-serif" font-size="12">Base Rate Multiplier:</text>
  <text x="325" y="258" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="end">1.25x</text>

  <text x="75" y="288" fill="#94a3b8" font-family="sans-serif" font-size="12">Peak Demand Surcharge:</text>
  <text x="325" y="288" fill="#4cc9f0" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="end">$0.00</text>

  <line x1="75" y1="302" x2="325" y2="302" stroke="rgba(255,255,255,0.1)"/>
  <text x="75" y="320" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="bold" font-size="13">Total Fare:</text>
  <text x="325" y="320" fill="#4cc9f0" font-family="'Poppins', sans-serif" font-weight="800" font-size="15" text-anchor="end">$12.50</text>

  <!-- Confirm Ride Button -->
  <rect x="55" y="348" width="290" height="46" rx="23" fill="url(#routeGrad)"/>
  <text x="200" y="376" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="700" font-size="15" text-anchor="middle">Confirm Booking Ride →</text>
</svg>
